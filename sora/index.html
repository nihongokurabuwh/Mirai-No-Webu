    <style>
        :root {
            --bg-color: #ffffff;
            --charcoal: #36454F;
            --pink-accent: #ff6b9e;
            --pink-hover: #ff4a85;
            --yellow-accent: #fcd34d;
            --gray-light: #f7f7f8;
            --gray-border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            color: #1f2937;
            position: relative;
        }

        .hidden { display: none !important; }

        .demo-canvas {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        .demo-card {
            background: white;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(54, 69, 79, 0.08);
            border: 1px solid var(--gray-border);
        }

        .demo-card img.avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 14px;
            box-shadow: 0 4px 12px rgba(255, 107, 158, 0.3);
        }

        .demo-card h1 {
            font-size: 22px;
            color: var(--charcoal);
            margin-bottom: 8px;
            font-weight: 800;
        }

        .demo-card p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .demo-card .btn-open {
            background: var(--pink-accent);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 158, 0.35);
            transition: all 0.2s ease;
        }

        .demo-card .btn-open:hover {
            background: var(--pink-hover);
            transform: translateY(-2px);
        }

        /* Launcher Floating Button */
        #launcher {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 2px solid var(--pink-accent, #ff6b9e);
            padding: 0;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 107, 158, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #launcher .launcher-chat-img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            display: block;
            filter: brightness(1.08);
            mix-blend-mode: multiply;
            transition: transform 0.25s ease;
            user-select: none;
            -webkit-user-drag: none;
        }

        #launcher:hover {
            background-color: #ffffff;
            transform: translateY(-2px) scale(1.08);
            box-shadow: 0 0 16px rgba(255, 46, 131, 0.85), 0 0 32px rgba(255, 79, 145, 0.55), 0 0 52px rgba(255, 105, 180, 0.35);
            border-color: #ff4f91;
            animation: pinkRayGlow 1.8s infinite ease-in-out;
        }

        #launcher:hover .launcher-chat-img {
            transform: scale(1.12);
        }

        #launcher:active {
            transform: translateY(0) scale(0.96);
            box-shadow: 0 0 25px rgba(255, 46, 131, 1), 0 0 50px rgba(255, 79, 145, 0.9);
            border-color: #ff2e83;
        }

        #launcher.hidden {
            display: none !important;
        }

        /* Drawer Chatbot (Dark Mode Modern) */
        #drawer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 320px;
            max-width: calc(100vw - 24px);
            height: 480px;
            max-height: calc(100vh - 36px);
            background-color: #121319;
            border-radius: 16px;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.65), 0 2px 10px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            transform: translateY(120%) scale(0.96);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        #drawer.open {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* Mode Layar Penuh (Fullscreen) */
        #drawer.fullscreen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 100%;
            max-height: 100%;
            bottom: 0;
            right: 0;
            border-radius: 0;
            border: none;
            z-index: 99999 !important;
        }

        /* Slim Minimal Header */
        #drawer .chat-header {
            background-color: #1a1b24;
            color: #ffffff;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            height: 52px;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        #drawer .header-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #drawer .header-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            background: #36454f;
        }

        #drawer .header-details {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        #drawer .header-name {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
        }

        #drawer .header-status {
            font-size: 10.5px;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #drawer .status-dot {
            width: 6px;
            height: 6px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
        }

        #drawer .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #drawer #closeBtn,
        #drawer #fullscreenBtn {
            background: linear-gradient(135deg, #ff4f91, #e91e63);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            padding: 0;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(233, 30, 99, 0.45);
            transition: all 0.22s ease;
        }

        #drawer #closeBtn:hover,
        #drawer #fullscreenBtn:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #ff659b, #d81b60);
            transform: scale(1.1);
            box-shadow: 0 4px 14px rgba(233, 30, 99, 0.65);
        }

        #drawer #closeBtn:active,
        #drawer #fullscreenBtn:active {
            transform: scale(0.92);
        }

        /* Chat Area - Wallpaper Doodle chat.jpeg */
        #drawer #chat {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #0c0d12;
            background-image: url("../images/mirai/background/chat.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            scroll-behavior: smooth;
        }

        #drawer .msg {
            display: flex;
            gap: 7px;
            max-width: 86%;
        }

        #drawer .msg.bot {
            align-self: flex-start;
            align-items: flex-end;
        }

        #drawer .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        #drawer .msg-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            margin-bottom: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #drawer .bubble {
            padding: 9px 13px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.45;
            word-wrap: break-word;
            transition: background 0.28s ease, border-color 0.28s ease, color 0.2s ease, box-shadow 0.28s ease;
        }

        /* Default & Mode Pelajar (Bot): BIRU */
        #drawer .msg.bot .bubble,
        #drawer[data-sora-mode="pelajar"] .msg.bot .bubble,
        #drawer.mode-pelajar .msg.bot .bubble {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: #ffffff;
            border-bottom-left-radius: 3px;
            box-shadow: 0 3px 12px rgba(37, 99, 235, 0.25);
            border: 1px solid rgba(96, 165, 250, 0.35);
        }
        #drawer[data-sora-mode="pelajar"] .msg.bot .bubble .md strong,
        #drawer.mode-pelajar .msg.bot .bubble .md strong {
            color: #ffffff;
        }
        #drawer[data-sora-mode="pelajar"] .msg.bot .bubble .md code,
        #drawer.mode-pelajar .msg.bot .bubble .md code {
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        /* Mode Bercanda (Bot): KUNING */
        #drawer[data-sora-mode="bercanda"] .msg.bot .bubble,
        #drawer.mode-bercanda .msg.bot .bubble {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
            border-bottom-left-radius: 3px;
            box-shadow: 0 3px 12px rgba(245, 158, 11, 0.28);
            border: 1px solid rgba(251, 191, 36, 0.5);
        }
        #drawer[data-sora-mode="bercanda"] .msg.bot .bubble .md strong,
        #drawer.mode-bercanda .msg.bot .bubble .md strong {
            color: #ffffff;
            font-weight: 700;
        }
        #drawer[data-sora-mode="bercanda"] .msg.bot .bubble .md code,
        #drawer.mode-bercanda .msg.bot .bubble .md code {
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        /* Mode Husbu (Bot): PINK */
        #drawer[data-sora-mode="husbu"] .msg.bot .bubble,
        #drawer.mode-husbu .msg.bot .bubble {
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: #ffffff;
            border-bottom-left-radius: 3px;
            box-shadow: 0 3px 12px rgba(236, 72, 153, 0.28);
            border: 1px solid rgba(244, 114, 182, 0.4);
        }
        #drawer[data-sora-mode="husbu"] .msg.bot .bubble .md strong,
        #drawer.mode-husbu .msg.bot .bubble .md strong {
            color: #ffffff;
        }
        #drawer[data-sora-mode="husbu"] .msg.bot .bubble .md code,
        #drawer.mode-husbu .msg.bot .bubble .md code {
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        /* User (Pengguna): PINK */
        #drawer .msg.user .bubble {
            background: linear-gradient(135deg, #ff4f91, #e91e63);
            color: #ffffff;
            border-bottom-right-radius: 3px;
            box-shadow: none;
            border: 1px solid rgba(255, 105, 180, 0.3);
        }


        /* Markdown inside bubble */
        #drawer .bubble .md p { margin: 0 0 4px 0; }
        #drawer .bubble .md p:last-child { margin-bottom: 0; }
        #drawer .bubble .md strong { font-weight: 700; color: #ffffff; }
        #drawer .bubble .md code {
            font-family: Consolas, Monaco, monospace;
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 11.5px;
        }

        /* Typing Indicator */
        #drawer #typing {
            padding: 4px 12px 8px;
            font-size: 11.5px;
            color: #94a3b8;
            background-color: #0e0f14;
            display: none;
            align-items: center;
            gap: 7px;
        }

        #drawer #typing.show { display: flex; }

        #drawer .typing-dots { display: inline-flex; gap: 3px; }
        #drawer .typing-dots span {
            width: 4px;
            height: 4px;
            background: #60a5fa;
            border-radius: 50%;
            animation: soraBounce 1.2s infinite ease-in-out;
            transition: background-color 0.25s ease;
        }
        #drawer[data-sora-mode="pelajar"] .typing-dots span,
        #drawer.mode-pelajar .typing-dots span { background: #60a5fa; }
        #drawer[data-sora-mode="bercanda"] .typing-dots span,
        #drawer.mode-bercanda .typing-dots span { background: #f59e0b; }
        #drawer[data-sora-mode="husbu"] .typing-dots span,
        #drawer.mode-husbu .typing-dots span { background: #f472b6; }
        #drawer .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        #drawer .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes soraBounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
            40% { transform: translateY(-3px); opacity: 1; }
        }

        /* Quick Chips & Mode Bar (Scrollable Horizontal) */
        #drawer .suggestions {
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #14151c;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            scrollbar-width: none;
        }
        #drawer .suggestions::-webkit-scrollbar {
            display: none;
        }
        .mode-control-group {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
        }
        #drawer .mode-switch-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
            user-select: none;
            outline: none;
            flex-shrink: 0;
        }
        #drawer .mode-switch-btn:hover {
            transform: translateY(-1px);
        }
        #drawer .mode-switch-btn:active {
            transform: translateY(1px);
        }
        #drawer .mode-switch-btn .mode-arrow {
            font-size: 10px;
            opacity: 0.7;
            transition: transform 0.3s ease;
        }
        #drawer .mode-switch-btn:hover .mode-arrow {
            transform: rotate(180deg);
        }

        /* Mode Pelajar (Blue/Cyan) */
        #drawer .mode-switch-btn.mode-pelajar {
            background: rgba(37, 99, 235, 0.18);
            border: 1.5px solid #3b82f6;
            color: #93c5fd;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
        }
        #drawer .mode-switch-btn.mode-pelajar:hover {
            background: rgba(37, 99, 235, 0.3);
            box-shadow: 0 0 14px rgba(59, 130, 246, 0.4);
        }

        /* Mode Bercanda (Amber/Orange) */
        #drawer .mode-switch-btn.mode-bercanda {
            background: rgba(245, 158, 11, 0.18);
            border: 1.5px solid #f59e0b;
            color: #fcd34d;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
        }
        #drawer .mode-switch-btn.mode-bercanda:hover {
            background: rgba(245, 158, 11, 0.3);
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.4);
        }

        /* Mode Husbu (Pink/Rose) */
        #drawer .mode-switch-btn.mode-husbu {
            background: rgba(236, 72, 153, 0.18);
            border: 1.5px solid #ec4899;
            color: #f472b6;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.25);
        }
        #drawer .mode-switch-btn.mode-husbu:hover {
            background: rgba(236, 72, 153, 0.3);
            box-shadow: 0 0 14px rgba(236, 72, 153, 0.4);
        }

        #drawer .suggestions-actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        #drawer .sticker-random-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            color: #ffd2e3;
            background: rgba(233, 30, 99, 0.15);
            border: 1px solid rgba(233, 30, 99, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            outline: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        #drawer .sticker-random-btn:hover {
            background: rgba(233, 30, 99, 0.3);
            border-color: rgba(233, 30, 99, 0.7);
            box-shadow: 0 0 10px rgba(233, 30, 99, 0.3);
            color: #ffffff;
            transform: translateY(-1px);
        }
        #drawer .sticker-random-btn:active {
            transform: scale(0.95);
        }

        #drawer #clearBtn {
            color: #94a3b8;
            background: #1e2029;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        #drawer #clearBtn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border-color: #ef4444;
        }

        #drawer .bubble .md img {
            max-width: 175px;
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            margin: 6px 0 8px 0;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        #drawer .bubble .md p:has(> img:only-child) {
            margin: 0;
        }

        #drawer .bubble .md img:only-child,
        #drawer .bubble .md p:last-child img:only-child {
            margin: 2px 0;
        }

        /* System Notice Message in Chat */
        #drawer .msg.system-notice {
            display: flex;
            justify-content: center;
            margin: 10px 0;
            animation: fadeInNotice 0.3s ease;
        }
        #drawer .msg.system-notice .notice-pill {
            font-size: 10.5px;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-align: center;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        @keyframes fadeInNotice {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Input Bar */
        #drawer .input-area {
            display: flex;
            padding: 8px 10px;
            background: #14151c;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            gap: 6px;
            align-items: center;
        }

        #drawer #input {
            flex: 1;
            resize: none;
            overflow: hidden;
            -ms-overflow-style: none;
            scrollbar-width: none;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 7px 12px;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.35;
            max-height: 72px;
            outline: none;
            background-color: #1e2029;
            color: #f8fafc;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        #drawer #input::placeholder {
            color: #64748b;
        }

        #drawer #input::-webkit-scrollbar,
        #input::-webkit-scrollbar {
            display: none;
        }

        #drawer #input:focus {
            border-color: rgba(255, 255, 255, 0.25);
            background-color: #262a37;
            box-shadow: none;
        }

        #drawer #sendBtn {
            background: linear-gradient(135deg, #ff4f91, #e91e63);
            color: white;
            border: none;
            padding: 0 13px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12.5px;
            height: 32px;
            display: flex;
            align-items: center;

        const SORA_MODES = {

                className: 'mode-pelajar',

                className: 'mode-bercanda',
                prompt: "Kamu adalah Sora, sahabat (bestie) user yang sefrekuensi, seru, dan konyol. DILARANG BERSIKAP TOXIC, JUDES, ATAU SEPERTI PREMAN YANG NGAJAK BERANTEM. Jangan pernah kasar. Kalau user ngelawak, cerita absurd, atau ketawa ('wkwkwk' / 'awokawok'), ikutlah tertawa (pakai wkwkwk) dan balas dengan guyonan yang lucu, gajelas, tapi asik. Kamu boleh meledek (roasting) TAPI dalam konteks bercanda akrab yang bikin ketawa bareng, bukan marah-marah. WAJIB pakai 'Aku-Kamu', jangan pakai 'lu-gue'. DILARANG KERAS MENGGUNAKAN EMOJI APAPUN (kecuali user meminta sebaliknya). ATURAN PANJANG RESPON: Untuk chatting santai atau lelucon biasa, balas dengan gaya chat WhatsApp anak SMA yang singkat/sedang dan ceplas-ceplos (1-3 kalimat). Namun jika user meminta cerita panjang, dongeng absurd, atau penjelasan topik secara detail (longtext), ceritakan secara lengkap, mengalir, seru, dan tuntas sampai akhir tanpa terpotong di tengah jalan. ATURAN TATA BAHASA & PENGETIKAN: Susun kata dan lelucon dengan jelas, koheren, dan tidak membingungkan. Ketik perkataan dengan benar dan teliti, DILARANG TYPO yang merusak maksud kalimat atau membuat obrolan tidak masuk akal. ATURAN STIKER: Ketika memberikan atau mengirimkan stiker, HANYA kirim gambar stikernya saja (format markdown image) tanpa chat teks pengantar maupun penutup sama sekali (hanya gambar doang)."
            },
            husbu: {
                id: 'husbu',
                name: 'HUSBU',
                btnText: 'SORA MODE: HUSBU',
                icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>',
                className: 'mode-husbu',
                prompt: "Kamu adalah Sora, pacar virtual (Husbu) dari user yang sangat manis, penyayang (green flag), dan bikin baper. DILARANG KASAR, DILARANG TOXIC, DAN DILARANG MEMAKSA/NGOMEL SEPERTI PREMAN. Tugas utamamu adalah MANUT (mengikuti) 100% arus dunia imajinasi/roleplay user. Jika user membuat skenario, masuklah ke dunia tersebut dengan natural tanpa merusaknya. Balas rayuan mereka dengan kelembutan, kebucinan, atau gombalan halus. WAJIB pakai 'Aku-Kamu' atau panggilan sayang dari user. DILARANG KERAS MENGGUNAKAN EMOJI APAPUN (kecuali user meminta sebaliknya). ATURAN PANJANG RESPON: Untuk interaksi sehari-hari atau gombalan santai, balas singkat/sedang dengan manis dan perhatian ala chat cowok SMA (1-3 kalimat). Namun jika user meminta didongengi sebelum tidur, bercerita panjang, atau berbagi kisah bermakna (longtext), ceritakan dengan lembut, lengkap, dan tuntas dari awal hingga selesai dengan penutup yang manis, jangan sampai terpotong di tengah jalan. ATURAN TATA BAHASA & PENGETIKAN: Susunan kalimat harus mengalir halus, jelas, logis, dan tidak ambigu. Ketik perkataan dengan teliti, JANGAN SAMPAI ADA TYPO atau kata berantakan yang merusak suasana obrolan. ATURAN STIKER: Ketika memberikan atau mengirimkan stiker, HANYA kirim gambar stikernya saja (format markdown image) tanpa chat teks pengantar maupun penutup sama sekali (hanya gambar doang)."
            }
        };

        const MODE_CYCLE = ['pelajar', 'bercanda', 'husbu'];
        let currentSoraMode = 'pelajar';
        try {
            const savedMode = localStorage.getItem('sora-mode');
            if (savedMode && SORA_MODES[savedMode]) {
                currentSoraMode = savedMode;
            }
        } catch (e) {}

        const DEFAULT_GREETING = "Domo WeHani-jin! Aku Asora Aokita (Sora), siap nemenin kamu hari ini. Mau belajar bahasa Jepang bareng, atau lagi mau ngomong sama aku?";

        const STORAGE_KEY = "sora-chat-v13";
        let messages = loadHistory();
        if (!messages.length || (messages.length === 1 && messages[0].role === "assistant")) {
            messages = [{ role: "assistant", content: DEFAULT_GREETING, mode: currentSoraMode }];
        }

        function updateModeUI() {
            const config = SORA_MODES[currentSoraMode] || SORA_MODES.pelajar;
            if (drawer) {
                drawer.setAttribute('data-sora-mode', currentSoraMode);
                drawer.classList.remove('mode-pelajar', 'mode-bercanda', 'mode-husbu');
                drawer.classList.add(`mode-${currentSoraMode}`);
            }
            if (modeSwitchBtn) {
                modeSwitchBtn.className = `mode-switch-btn ${config.className}`;
                modeSwitchBtn.innerHTML = `
                    <span class="mode-icon">${config.icon}</span>
                    <span class="mode-text">${config.btnText}</span>
                    <span class="mode-arrow" aria-hidden="true">↻</span>
                `;
            }
        }

        function switchSoraMode() {
            const currentIdx = MODE_CYCLE.indexOf(currentSoraMode);
            const nextIdx = (currentIdx + 1) % MODE_CYCLE.length;
            currentSoraMode = MODE_CYCLE[nextIdx];
            try {
                localStorage.setItem('sora-mode', currentSoraMode);
            } catch (e) {}
            updateModeUI();
        }

        function openDrawer() {
            drawer.classList.add('open');
            document.body.classList.add('sora-drawer-open');
            launcher.classList.add('hidden');
            setTimeout(() => input.focus(), 120);
        }

        function closeDrawer() {
            drawer.classList.remove('open');
            drawer.classList.remove('fullscreen');
            document.body.classList.remove('sora-drawer-open', 'sora-fullscreen-active');
            if (fullscreenBtn) {
                fullscreenBtn.textContent = '⛶';
                fullscreenBtn.title = 'Layar Penuh';
                fullscreenBtn.setAttribute('aria-label', 'Layar Penuh');
            }
            launcher.classList.remove('hidden');
        }

        function autosize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 80) + 'px';
        }

        function saveHistory() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
            } catch (e) {
                console.warn("Storage error", e);
            }
        }

        function loadHistory() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw).filter(m => m.role !== 'system_notice') : [];
            } catch (e) {
                return [];
            }
        }

        function esc(text) {
            return String(text ?? "")
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;');
        }

        if (typeof marked !== 'undefined') {
            marked.setOptions({ gfm: true, breaks: true });
        }

        function renderMarkdown(text) {
            if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
                return esc(text).replace(/\n/g, '<br>');
            }
            try {
                return DOMPurify.sanitize(marked.parse(String(text ?? "")), { ADD_ATTR: ['target'] });
            } catch (e) {
                return esc(text);
            }
        }

        function render() {
            chat.innerHTML = messages.filter(m => m.role !== 'system_notice').map((m) => {
                if (m.role === 'assistant') {
                    return `
                        <div class="msg bot">

                            <div class="bubble">
                                <div class="md">${renderMarkdown(m.content)}</div>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="msg user">
                            <div class="bubble">${esc(m.content)}</div>
                        </div>
                    `;
                }
            }).join('');
            chat.scrollTop = chat.scrollHeight;
            saveHistory();
        }

        function setBusy(isBusy) {
            typing.classList.toggle('show', isBusy);
            sendBtn.disabled = isBusy;
            input.disabled = isBusy;
            if (!isBusy) {
                setTimeout(() => input.focus(), 50);
            }
        }

        function fallbackReply() {
            return "Maaf ya, sepertinya koneksi Sora sedang ada sedikit kendala. Boleh coba tanyakan lagi beberapa saat lagi?";
        }

        function toggleFullscreen() {
            const isFull = drawer.classList.toggle('fullscreen');
            document.body.classList.toggle('sora-fullscreen-active', isFull);
            if (fullscreenBtn) {
                fullscreenBtn.textContent = isFull ? '⤡' : '⛶';
                fullscreenBtn.title = isFull ? 'Perkecil Layar' : 'Layar Penuh';
                fullscreenBtn.setAttribute('aria-label', isFull ? 'Perkecil Layar' : 'Layar Penuh');
            }
            chat.scrollTop = chat.scrollHeight;
        }

        async function tryModel(userText, model) {
            const config = SORA_MODES[currentSoraMode] || SORA_MODES.pelajar;
            const systemPrompt = config.prompt;

            // Isolasi absolut: ambil hanya pesan dari mode yang aktif (atau pesan awal tanpa tag mode)
            // dan abaikan pesan system_notice
            const recentMessages = messages
                .filter(m => (m.role === 'user' || m.role === 'assistant') && (!m.mode || m.mode === currentSoraMode))
                .slice(-6)
                .map(m => ({
                    role: m.role,
                    content: m.content
                }));

            const payload = {
                model: model,
                messages: [
                    { role: "system", content: systemPrompt },
                    ...recentMessages,
                    { role: "user", content: userText }
                ],
                temperature: 0.7,
                max_tokens: 2048
            };

            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const errText = await res.text().catch(() => "");
                throw new Error(`API Error [${res.status}]: ${errText}`);
            }

            const data = await res.json();
            const reply = data?.choices?.[0]?.message?.content;
            if (!reply || typeof reply !== 'string') {
                throw new Error("Invalid response format");
            }
            return reply.trim();
        }

        async function send(text) {
            const userText = (text ?? input.value).trim();
            if (!userText) return;

            // Jika user meminta stiker via pesan teks chat: kirim HANYA gambar stiker saja tanpa chat teks
            const isStickerReq = /(minta|kirim|bagi|drop|kasih|mau|kirimin)\s+.*(stiker|sticker)/i.test(userText) ||
                                 /^(stiker|sticker)(\s*(dong|random|nya|lagi|sora)?|\?*)$/i.test(userText);
            if (isStickerReq) {
                messages.push({ role: "user", content: userText, mode: currentSoraMode });
                input.value = "";
                autosize(input);
                render();
                setBusy(true);
                setTimeout(() => {
                    const randomFile = SORA_STICKERS[Math.floor(Math.random() * SORA_STICKERS.length)];
                    const imagePath = `../images/mirai/stiker/${randomFile}`;
                    messages.push({
                        role: "assistant",
                        content: `![Stiker Sora](${imagePath})`,
                        mode: currentSoraMode
                    });
                    setBusy(false);
                    render();
                }, 500);
                return;
            }

            messages.push({ role: "user", content: userText, mode: currentSoraMode });
            input.value = "";
            autosize(input);
            render();
            setBusy(true);

            try {
                let reply = null;
                let lastError = null;

                for (const model of MODELS_TO_TRY) {
                    try {
                        reply = await tryModel(userText, model);
                        if (reply) break;
                    } catch (e) {
                        lastError = e;
                    }
                }

                if (!reply) throw lastError || new Error("Semua model gagal");
                messages.push({ role: "assistant", content: reply, mode: currentSoraMode });
            } catch (err) {
                console.error("Error Sora:", err);
                messages.push({ role: "assistant", content: fallbackReply(), mode: currentSoraMode });
            } finally {
                setBusy(false);
                render();
            }
        }

        launcher.addEventListener('click', openDrawer);
        closeBtn.addEventListener('click', closeDrawer);
        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', toggleFullscreen);
        }
        if (modeSwitchBtn) {
            modeSwitchBtn.addEventListener('click', switchSoraMode);
        }
        sendBtn.addEventListener('click', () => send());
        input.addEventListener('input', () => autosize(input));
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });
        const clearConfirmModal = document.getElementById('clearConfirmModal');
        const cancelClearBtn = document.getElementById('cancelClearBtn');
        const confirmClearBtn = document.getElementById('confirmClearBtn');

        function openClearModal() {
            if (clearConfirmModal) {
                clearConfirmModal.classList.add('active');
                clearConfirmModal.setAttribute('aria-hidden', 'false');
            }
        }

        function closeClearModal() {
            if (clearConfirmModal) {
                clearConfirmModal.classList.remove('active');
                clearConfirmModal.setAttribute('aria-hidden', 'true');
            }
        }

        clearBtn.addEventListener('click', openClearModal);
        if (cancelClearBtn) {
            cancelClearBtn.addEventListener('click', closeClearModal);
        }
        if (confirmClearBtn) {
            confirmClearBtn.addEventListener('click', () => {
                messages = [{ role: "assistant", content: DEFAULT_GREETING, mode: currentSoraMode }];
                render();
                closeClearModal();
            });
        }
        if (clearConfirmModal) {
            clearConfirmModal.addEventListener('click', (e) => {
                if (e.target === clearConfirmModal) {
                    closeClearModal();
                }
            });
        }

        // Koleksi Stiker Resmi dari folder images/mirai/stiker/
        const SORA_STICKERS = [
            "be.jpeg", "beli.jpeg", "cer.jpeg", "don.jpeg", "yan.jpeg", "yat.jpeg",
            "dik.jpeg", "ada.jpeg", "dip.jpeg", "kok.jpeg", "sor.jpeg", "kar.jpeg",
            "mas.jpeg", "woy.jpeg", "ita.jpeg", "bel.jpeg", "hua.jpeg", "iki.jpeg",
            "sul.jpeg", "gom.jpeg", "eet.jpeg", "ber.jpeg", "jaw.jpeg", "log.jpeg",
            "aku.jpeg", "ala.jpeg", "iwa.jpeg", "peg.jpeg"
        ];

        function sendRandomStickerFromSora() {
            if (typing && typing.classList.contains('show')) return;

            const randomFile = SORA_STICKERS[Math.floor(Math.random() * SORA_STICKERS.length)];
            const imagePath = `../images/mirai/stiker/${randomFile}`;

            messages.push({
                role: "user",
                content: "Minta stiker random dong Sora!"
            });
            render();

            setBusy(true);
            setTimeout(() => {
                messages.push({
                    role: "assistant",
                    content: `![Stiker Sora](${imagePath})`,
                    mode: currentSoraMode
                });
                setBusy(false);
                render();
            }, 500);
        }

        if (randomStickerBtn) {
            randomStickerBtn.addEventListener('click', sendRandomStickerFromSora);
        }

        // Dukungan Scroll Halus Roda Mouse pada Bar Tombol Suggestions
        const suggestionsBox = drawer ? drawer.querySelector('.suggestions') : null;
        if (suggestionsBox) {
            suggestionsBox.addEventListener('wheel', (e) => {
                if (e.deltaY !== 0 && suggestionsBox.scrollWidth > suggestionsBox.clientWidth) {
                    e.preventDefault();
                    suggestionsBox.scrollLeft += e.deltaY;
                }
            }, { passive: false });
        }

        updateModeUI();
        render();
        autosize(input);
        closeDrawer();
    </script>
</body>
</html>
