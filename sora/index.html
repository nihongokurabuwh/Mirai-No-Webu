    <style>
        :root {
            --bg-color: #ffffff;
            --charcoal: #36454F;
            --pink-accent: #ff6b9e;
            --pink-hover: #ff4a85;
            --yellow-accent: #fcd34d;
            --gray-light: #f7f7f8;
            --gray-border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            color: #1f2937;
            position: relative;
        }

        .hidden { display: none !important; }

        .demo-canvas {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        .demo-card {
            background: white;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(54, 69, 79, 0.08);
            border: 1px solid var(--gray-border);
        }

        .demo-card img.avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 14px;
            box-shadow: 0 4px 12px rgba(255, 107, 158, 0.3);
        }

        .demo-card h1 {
            font-size: 22px;
            color: var(--charcoal);
            margin-bottom: 8px;
            font-weight: 800;
        }

        .demo-card p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .demo-card .btn-open {
            background: var(--pink-accent);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 158, 0.35);
            transition: all 0.2s ease;
        }

        .demo-card .btn-open:hover {
            background: var(--pink-hover);
            transform: translateY(-2px);
        }

        /* Launcher Floating Button */
        #launcher {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 2px solid var(--pink-accent, #ff6b9e);
            padding: 0;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 107, 158, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #launcher .launcher-chat-img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            display: block;
            filter: brightness(1.08);
            mix-blend-mode: multiply;
            transition: transform 0.25s ease;
            user-select: none;
            -webkit-user-drag: none;
        }

        #launcher:hover {
            background-color: #ffffff;
            transform: translateY(-2px) scale(1.08);
            box-shadow: 0 0 16px rgba(255, 46, 131, 0.85), 0 0 32px rgba(255, 79, 145, 0.55), 0 0 52px rgba(255, 105, 180, 0.35);
            border-color: #ff4f91;
            animation: pinkRayGlow 1.8s infinite ease-in-out;
        }

        #launcher:hover .launcher-chat-img {
            transform: scale(1.12);
        }

        #launcher:active {
            transform: translateY(0) scale(0.96);
            box-shadow: 0 0 25px rgba(255, 46, 131, 1), 0 0 50px rgba(255, 79, 145, 0.9);
            border-color: #ff2e83;
        }

        #launcher.hidden {
            display: none !important;
        }

        /* Drawer Chatbot (Dark Mode Modern) */
        #drawer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 320px;
            max-width: calc(100vw - 24px);
            height: 480px;
            max-height: calc(100vh - 36px);
            background-color: #121319;
            border-radius: 16px;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.65), 0 2px 10px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            transform: translateY(120%) scale(0.96);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        #drawer.open {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* Mode Layar Penuh (Fullscreen) */
        #drawer.fullscreen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 100%;
            max-height: 100%;
            bottom: 0;
            right: 0;
            border-radius: 0;
            border: none;
            z-index: 99999 !important;
        }

        /* Slim Minimal Header */
        #drawer .chat-header {
            background-color: #1a1b24;
            color: #ffffff;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            height: 52px;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        #drawer .header-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #drawer .header-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            background: #36454f;
        }

        #drawer .header-details {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        #drawer .header-name {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
        }

        #drawer .header-status {
            font-size: 10.5px;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #drawer .status-dot {
            width: 6px;
            height: 6px;
            background-color: #4ade80;
            border-radius: 50%;
            display: inline-block;
        }

        #drawer .header-actions {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        #drawer #closeBtn,
        #drawer #fullscreenBtn {
            background: linear-gradient(135deg, #ff4f91, #e91e63);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            padding: 0;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(233, 30, 99, 0.45);
            transition: all 0.22s ease;
            flex-shrink: 0;
        }

        #drawer #closeBtn:hover,
        #drawer #fullscreenBtn:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #ff659b, #d81b60);
            transform: scale(1.08);
            box-shadow: 0 4px 14px rgba(233, 30, 99, 0.65);
        }

        #drawer #closeBtn:active,
        #drawer #fullscreenBtn:active {
            transform: scale(0.92);
        }

        #drawer #fullscreenBtn svg,
        #drawer #closeBtn svg {
            width: 17px;
            height: 17px;
            display: block;
            pointer-events: none;
        }

        /* Chat Area - Wallpaper Doodle chat.jpeg */
        #drawer #chat {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #0c0d12;
            background-image: url("../images/mirai/background/chat.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            scroll-behavior: smooth;
        }

        #drawer .msg {
            display: flex;
            gap: 7px;
            max-width: 86%;
        }

        #drawer .msg.bot {
            align-self: flex-start;
            align-items: flex-end;
        }

        #drawer .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        #drawer .msg-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            margin-bottom: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #drawer .bubble {
            padding: 9px 13px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.45;
            word-wrap: break-word;
            transition: background 0.28s ease, border-color 0.28s ease, color 0.2s ease, box-shadow 0.28s ease;
        }

        /* Default & Mode Pelajar (Bot): BIRU */
        #drawer .msg.bot .bubble,
        #drawer[data-sora-mode="standard"] .msg.bot .bubble,
        #drawer.mode-standard .msg.bot .bubble,
        #drawer[data-sora-mode="pelajar"] .msg.bot .bubble,
        #drawer.mode-pelajar .msg.bot .bubble {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: #ffffff;
            border-bottom-left-radius: 3px;
            box-shadow: 0 3px 12px rgba(37, 99, 235, 0.25);
            border: 1px solid rgba(96, 165, 250, 0.35);
        }
        #drawer[data-sora-mode="standard"] .msg.bot .bubble .md strong,
        #drawer.mode-standard .msg.bot .bubble .md strong,
        #drawer[data-sora-mode="pelajar"] .msg.bot .bubble .md strong,
        #drawer.mode-pelajar .msg.bot .bubble .md strong {
            color: #ffffff;
        }
        #drawer[data-sora-mode="standard"] .msg.bot .bubble .md code,
        #drawer.mode-standard .msg.bot .bubble .md code,
        #drawer[data-sora-mode="pelajar"] .msg.bot .bubble .md code,
        #drawer.mode-pelajar .msg.bot .bubble .md code {
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        /* Mode Teman / Bercanda (Bot): KUNING/AMBER */
        #drawer[data-sora-mode="teman"] .msg.bot .bubble,
        #drawer.mode-teman .msg.bot .bubble,
        #drawer[data-sora-mode="bercanda"] .msg.bot .bubble,
        #drawer.mode-bercanda .msg.bot .bubble {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
            border-bottom-left-radius: 3px;
            box-shadow: 0 3px 12px rgba(245, 158, 11, 0.28);
            border: 1px solid rgba(251, 191, 36, 0.5);
        }
        #drawer[data-sora-mode="teman"] .msg.bot .bubble .md strong,
        #drawer.mode-teman .msg.bot .bubble .md strong,
        #drawer[data-sora-mode="bercanda"] .msg.bot .bubble .md strong,
        #drawer.mode-bercanda .msg.bot .bubble .md strong {
            color: #ffffff;
            font-weight: 700;
        }
        #drawer[data-sora-mode="teman"] .msg.bot .bubble .md code,
        #drawer.mode-teman .msg.bot .bubble .md code,
        #drawer[data-sora-mode="bercanda"] .msg.bot .bubble .md code,
        #drawer.mode-bercanda .msg.bot .bubble .md code {
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        /* Mode Sensei (Bot): INDIGO/VIOLET */
        #drawer[data-sora-mode="sensei"] .msg.bot .bubble,
        #drawer.mode-sensei .msg.bot .bubble {
            background: linear-gradient(135deg, #4338ca, #6366f1);
            color: #ffffff;
            border-bottom-left-radius: 3px;
            box-shadow: 0 3px 12px rgba(99, 102, 241, 0.28);
            border: 1px solid rgba(165, 180, 252, 0.45);
        }
        #drawer[data-sora-mode="sensei"] .msg.bot .bubble .md strong,
        #drawer.mode-sensei .msg.bot .bubble .md strong {
            color: #ffffff;
            font-weight: 700;
        }
        #drawer[data-sora-mode="sensei"] .msg.bot .bubble .md code,
        #drawer.mode-sensei .msg.bot .bubble .md code {
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        /* Mode Husbu (Bot): PINK */
        #drawer[data-sora-mode="husbu"] .msg.bot .bubble,
        #drawer.mode-husbu .msg.bot .bubble {
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: #ffffff;
            border-bottom-left-radius: 3px;
            box-shadow: 0 3px 12px rgba(236, 72, 153, 0.28);
            border: 1px solid rgba(244, 114, 182, 0.4);
        }
        #drawer[data-sora-mode="husbu"] .msg.bot .bubble .md strong,
        #drawer.mode-husbu .msg.bot .bubble .md strong {
            color: #ffffff;
        }
        #drawer[data-sora-mode="husbu"] .msg.bot .bubble .md code,
        #drawer.mode-husbu .msg.bot .bubble .md code {
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
        }

        /* User (Pengguna): PINK */
        #drawer .msg.user .bubble {
            background: linear-gradient(135deg, #ff4f91, #e91e63);
            color: #ffffff;
            border-bottom-right-radius: 3px;
            box-shadow: none;
            border: 1px solid rgba(255, 105, 180, 0.3);
        }


        /* Markdown inside bubble */
        #drawer .bubble .md p { margin: 0 0 4px 0; }
        #drawer .bubble .md p:last-child { margin-bottom: 0; }
        #drawer .bubble .md strong { font-weight: 700; color: #ffffff; }
        #drawer .bubble .md code {
            font-family: Consolas, Monaco, monospace;
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 11.5px;
        }

        /* Typing Indicator */
        #drawer #typing {
            padding: 4px 12px 8px;
            font-size: 11.5px;
            color: #94a3b8;
            background-color: #0e0f14;
            display: none;
            align-items: center;
            gap: 7px;
        }

        #drawer #typing.show { display: flex; }

        #drawer .typing-dots { display: inline-flex; gap: 3px; }
        #drawer .typing-dots span {
            width: 4px;
            height: 4px;
            background: #60a5fa;
            border-radius: 50%;
            animation: soraBounce 1.2s infinite ease-in-out;
            transition: background-color 0.25s ease;
        }
        #drawer[data-sora-mode="standard"] .typing-dots span,
        #drawer.mode-standard .typing-dots span,
        #drawer[data-sora-mode="pelajar"] .typing-dots span,
        #drawer.mode-pelajar .typing-dots span { background: #60a5fa; }
        #drawer[data-sora-mode="teman"] .typing-dots span,
        #drawer.mode-teman .typing-dots span,
        #drawer[data-sora-mode="bercanda"] .typing-dots span,
        #drawer.mode-bercanda .typing-dots span { background: #f59e0b; }
        #drawer[data-sora-mode="sensei"] .typing-dots span,
        #drawer.mode-sensei .typing-dots span { background: #818cf8; }
        #drawer[data-sora-mode="husbu"] .typing-dots span,
        #drawer.mode-husbu .typing-dots span { background: #f472b6; }
        #drawer .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        #drawer .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes soraBounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
            40% { transform: translateY(-3px); opacity: 1; }
        }

        /* Quick Chips & Mode Bar (Scrollable Horizontal) */
        #drawer .suggestions {
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #14151c;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            scrollbar-width: none;
        }
        #drawer .suggestions::-webkit-scrollbar {
            display: none;
        }
        .mode-control-group {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
        }
        #drawer .mode-switch-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
            user-select: none;
            outline: none;
            flex-shrink: 0;
        }
        #drawer .mode-switch-btn:hover {
            transform: translateY(-1px);
        }
        #drawer .mode-switch-btn:active {
            transform: translateY(1px);
        }
        #drawer .mode-switch-btn .mode-arrow {
            font-size: 10px;
            opacity: 0.7;
            transition: transform 0.3s ease;
        }
        #drawer .mode-switch-btn:hover .mode-arrow {
            transform: rotate(180deg);
        }

        /* Mode Standard / Pelajar (Blue/Cyan) */
        #drawer .mode-switch-btn.mode-standard,
        #drawer .mode-switch-btn.mode-pelajar {
            background: rgba(37, 99, 235, 0.18);
            border: 1.5px solid #3b82f6;
            color: #93c5fd;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
        }
        #drawer .mode-switch-btn.mode-standard:hover,
        #drawer .mode-switch-btn.mode-pelajar:hover {
            background: rgba(37, 99, 235, 0.3);
            box-shadow: 0 0 14px rgba(59, 130, 246, 0.4);
        }

        /* Mode Teman / Bercanda (Amber/Orange) */
        #drawer .mode-switch-btn.mode-teman,
        #drawer .mode-switch-btn.mode-bercanda {
            background: rgba(245, 158, 11, 0.18);
            border: 1.5px solid #f59e0b;
            color: #fcd34d;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
        }
        #drawer .mode-switch-btn.mode-teman:hover,
        #drawer .mode-switch-btn.mode-bercanda:hover {
            background: rgba(245, 158, 11, 0.3);
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.4);
        }

        /* Mode Sensei (Indigo/Violet) */
        #drawer .mode-switch-btn.mode-sensei {
            background: rgba(99, 102, 241, 0.18);
            border: 1.5px solid #6366f1;
            color: #a5b4fc;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.25);
        }
        #drawer .mode-switch-btn.mode-sensei:hover {
            background: rgba(99, 102, 241, 0.3);
            box-shadow: 0 0 14px rgba(99, 102, 241, 0.4);
        }

        /* Mode Husbu (Pink/Rose) */
        #drawer .mode-switch-btn.mode-husbu {
            background: rgba(236, 72, 153, 0.18);
            border: 1.5px solid #ec4899;
            color: #f472b6;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.25);
        }
        #drawer .mode-switch-btn.mode-husbu:hover {
            background: rgba(236, 72, 153, 0.3);
            box-shadow: 0 0 14px rgba(236, 72, 153, 0.4);
        }

        /* Chips Pertanyaan Cepat (Dynamic Suggestions) */
        #drawer .suggestion-chips-container {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        #drawer .suggestion-chip {
            display: inline-flex;
            align-items: center;
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 500;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            user-select: none;
            flex-shrink: 0;
            outline: none;
        }
        #drawer .suggestion-chip:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.28);
            color: #ffffff;
            transform: translateY(-1px);
        }
        #drawer .suggestion-chip:active {
            transform: scale(0.96);
        }

        #drawer .suggestions-actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        #drawer .sticker-random-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;

    <script>
        const drawer = document.getElementById('drawer');
        const launcher = document.getElementById('launcher');
        const closeBtn = document.getElementById('closeBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const randomStickerBtn = document.getElementById('randomStickerBtn');
        const typing = document.getElementById('typing');
        const modeSwitchBtn = document.getElementById('modeSwitchBtn');

        const API_URL = "https://sora-proxy.aqmarboli.workers.dev";
        const MODELS_TO_TRY = [
            "openai/gpt-oss-120b",
            "qwen/qwen3.8-27b",
            "openai/gpt-oss-20b",
            "llama-3.3-70b-versatile",
            "llama-3.1-8b-instant"
        ];

        const SORA_CONFIG = window.SoraConfig || {};
        const SORA_MODES = (SORA_CONFIG && SORA_CONFIG.MODE_CONFIGS) ? SORA_CONFIG.MODE_CONFIGS : {
            standard: {
                id: 'standard',
                name: 'STANDARD',
                btnText: 'SORA MODE: STANDARD',
                icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>',
                className: 'mode-standard',
                welcome: "Halo! Aku Asora Aokita (Sora). Mau santai ngobrol atau ada materi yang mau kita bahas bareng hari ini?",
                suggestions: ["Kenalan sama ekskul Mirai no Hana dong", "Gimana urutan mulai belajar bahasa Jepang dari nol?", "Trik cepat bedain huruf Hiragana dan Katakana", "Rekomendasi anime bagus buat nemenin belajar"]
            },
            teman: {
                id: 'teman',
                name: 'TEMAN',
                btnText: 'SORA MODE: TEMAN',
                icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>',
                className: 'mode-teman',
                welcome: "Yoo! Lagi santai ya? Tumben nih mampir, mau cerita apa atau lagi pusing sama tugas sekolah?",
                suggestions: ["Lagi pusing tugas sekolah nih, butuh suntikan semangat", "Anime season ini yang wajib ditonton apa ya menurutmu?", "Wkwk ada cerita absurd nggak selama kegiatan ekskul?", "Enakan mulai cicil kanji atau grammar dulu sih?"]
            },
            sensei: {
                id: 'sensei',
                name: 'SENSEI',
                btnText: 'SORA MODE: SENSEI',
                icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>',
                className: 'mode-sensei',
                welcome: "Konnichiwa! Di mode Sensei ini, kita bisa kupas tuntas tata bahasa, kanji, atau persiapan JLPT dengan santai. Materi apa yang ingin kamu pahami hari ini?",
                suggestions: ["Bisa jelasin perbedaan partikel は (wa) dan が (ga)?", "Trik cepat hafal huruf Katakana yang mirip dong (シ vs ツ)", "Bikinin contoh percakapan praktis pesan makanan di resto Jepang", "Pola kalimat dasar JLPT N5 yang paling sering dipakai apa aja?"]
            },
            husbu: {
                id: 'husbu',
                name: 'HUSBU',
                btnText: 'SORA MODE: HUSBU',
                icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>',
                className: 'mode-husbu',
                welcome: "Hai. Capek ya hari ini? Duduk dulu santai, ceritain apa aja yang lagi ada di pikiranmu... aku dengerin kok.",
                suggestions: ["Hari ini capek banget, butuh didengerin sebentar...", "Menurutmu aku harus istirahat dulu apa lanjut nugas ya?", "Ceritain hal yang bikin hati tenang dong", "Boleh temenin aku begadang nugas sebentar?"]
            }
        };

        // Aliases backward-compatibility
        if (!SORA_MODES.pelajar) SORA_MODES.pelajar = SORA_MODES.standard;
        if (!SORA_MODES.bercanda) SORA_MODES.bercanda = SORA_MODES.teman;

        const MODE_CYCLE = (SORA_CONFIG && SORA_CONFIG.MODE_CYCLE) ? SORA_CONFIG.MODE_CYCLE : ['standard', 'teman', 'sensei', 'husbu'];
        let currentSoraMode = 'standard';
        try {
            const savedMode = localStorage.getItem('sora-mode');
            if (savedMode) {
                const norm = SORA_CONFIG.normalizeModeId ? SORA_CONFIG.normalizeModeId(savedMode) : savedMode;
                if (SORA_MODES[norm]) {
                    currentSoraMode = norm;
                }
            }
        } catch (e) {}

        const DEFAULT_GREETING = (SORA_CONFIG && typeof SORA_CONFIG.getWelcomeMessage === 'function')
            ? SORA_CONFIG.getWelcomeMessage(currentSoraMode)
            : (SORA_MODES[currentSoraMode]?.welcome || "Halo! Aku Asora Aokita (Sora). Mau santai ngobrol atau ada hal yang mau kita bahas bareng hari ini?");

        const STORAGE_KEY = "sora-chat-v13";
        let messages = loadHistory();
        if (!messages.length || (messages.length === 1 && messages[0].role === "assistant")) {
            messages = [{ role: "assistant", content: DEFAULT_GREETING, mode: currentSoraMode }];
        }

        function renderSuggestionChips(config) {
            let container = document.getElementById('suggestionChips');
            if (!container) {
                const actions = drawer ? drawer.querySelector('.suggestions-actions') : null;
                if (actions) {
                    container = document.createElement('div');
                    container.id = 'suggestionChips';
                    container.className = 'suggestion-chips-container';
                    actions.parentNode.insertBefore(container, actions);
                }
            }
            if (!container) return;
            const list = config.suggestions || [];
            container.innerHTML = list.map(q => `
                <button type="button" class="suggestion-chip" data-chip="${esc(q)}">${esc(q)}</button>
            `).join('');
            container.querySelectorAll('.suggestion-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const txt = btn.getAttribute('data-chip');
                    if (txt) send(txt);
                });
            });
        }

        function updateModeUI() {
            const config = SORA_MODES[currentSoraMode] || SORA_MODES.standard || SORA_MODES.pelajar;
            if (drawer) {
                drawer.setAttribute('data-sora-mode', config.id || currentSoraMode);
                drawer.classList.remove('mode-standard', 'mode-teman', 'mode-sensei', 'mode-husbu', 'mode-pelajar', 'mode-bercanda');
                drawer.classList.add(`mode-${config.id || currentSoraMode}`);
            }
            if (modeSwitchBtn) {
                modeSwitchBtn.className = `mode-switch-btn ${config.className}`;
                modeSwitchBtn.innerHTML = `
                    <span class="mode-icon">${config.icon}</span>
                    <span class="mode-text">${config.btnText}</span>
                    <span class="mode-arrow" aria-hidden="true">↻</span>
                `;
            }
            renderSuggestionChips(config);
        }

        function switchSoraMode() {
            const currentIdx = MODE_CYCLE.indexOf(currentSoraMode);
            const nextIdx = (currentIdx + 1) % MODE_CYCLE.length;
            currentSoraMode = MODE_CYCLE[nextIdx];
            try {
                localStorage.setItem('sora-mode', currentSoraMode);
            } catch (e) {}
            updateModeUI();
        }

        function openDrawer() {
            drawer.classList.add('open');
            document.body.classList.add('sora-drawer-open');
            launcher.classList.add('hidden');
            setTimeout(() => input.focus(), 120);
        }

        function closeDrawer() {
            drawer.classList.remove('open');
            drawer.classList.remove('fullscreen');
            document.body.classList.remove('sora-drawer-open', 'sora-fullscreen-active');
            if (fullscreenBtn) {
                fullscreenBtn.textContent = '⛶';
                fullscreenBtn.title = 'Layar Penuh';
                fullscreenBtn.setAttribute('aria-label', 'Layar Penuh');
            }
            launcher.classList.remove('hidden');
        }

        function autosize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 80) + 'px';
        }

        function saveHistory() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
            } catch (e) {
                console.warn("Storage error", e);
            }
        }

        function loadHistory() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw).filter(m => m.role !== 'system_notice') : [];
            } catch (e) {
                return [];
            }
        }

        function esc(text) {
            return String(text ?? "")
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;');
        }

        if (typeof marked !== 'undefined') {
            marked.setOptions({ gfm: true, breaks: true });
        }

        function isStickerOnly(content) {
            if (SORA_CONFIG && typeof SORA_CONFIG.isStickerOnly === 'function') {
                return SORA_CONFIG.isStickerOnly(content);
            }
            if (!content || typeof content !== 'string') return false;
            return /^!\[([^\]]*)\]\(([^)]+)\)$/.test(content.trim());
        }

        function renderMarkdown(text) {
            if (SORA_CONFIG && typeof SORA_CONFIG.renderChatMarkdown === 'function') {
                return SORA_CONFIG.renderChatMarkdown(text);
            }
            const raw = String(text ?? "").trim();
            if (!raw) return "";

            if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
                try {
                    const html = DOMPurify.sanitize(marked.parse(raw), {
                        ADD_ATTR: ['target', 'loading', 'decoding'],
                        ADD_TAGS: ['img']
                    });
                    if (html && html.trim()) {
                        return html.replace(/<img\s+/g, '<img class="sora-chat-sticker" loading="lazy" decoding="async" ');
                    }
                } catch (e) {}
            }

            // Fallback mandiri
            let out = esc(raw);
            out = out.replace(/!\[(.*?)\]\((.*?)\)/g, '<img class="sora-chat-sticker" src="$2" alt="$1" loading="lazy" decoding="async">');
            out = out.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            out = out.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
            out = out.replace(/\n/g, '<br>');
            return out;
        }

        function render() {
            chat.innerHTML = messages.filter(m => m.role !== 'system_notice').map((m) => {
                const isSticker = isStickerOnly(m.content);
                const bubbleClass = isSticker ? 'bubble sticker-bubble' : 'bubble';
                if (m.role === 'assistant') {
                    return `
                        <div class="msg bot">
                            <img class="msg-avatar" src="images/sorachat.jpeg" alt="Sora" loading="lazy" decoding="async" width="516" height="529">
                            <div class="${bubbleClass}">
                                <div class="md">${renderMarkdown(m.content)}</div>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="msg user">
                            <div class="${bubbleClass}">${isSticker ? renderMarkdown(m.content) : esc(m.content)}</div>
                        </div>
                    `;
                }
            }).join('');
            chat.scrollTop = chat.scrollHeight;
            saveHistory();
        }

        function setBusy(isBusy) {
            typing.classList.toggle('show', isBusy);
            sendBtn.disabled = isBusy;
            input.disabled = isBusy;
            if (!isBusy) {
                setTimeout(() => input.focus(), 50);
            }
        }

        function fallbackReply() {
            return "Maaf ya, sepertinya koneksi Sora sedang ada sedikit kendala. Boleh coba tanyakan lagi beberapa saat lagi?";
        }

        function toggleFullscreen() {
            const isFull = drawer.classList.toggle('fullscreen');
            document.body.classList.toggle('sora-fullscreen-active', isFull);
            setFullscreenIcon(isFull);
            chat.scrollTop = chat.scrollHeight;
        }

        async function tryModel(userText, model) {
            const config = SORA_MODES[currentSoraMode] || SORA_MODES.standard || SORA_MODES.pelajar;
            const systemPrompt = (SORA_CONFIG && typeof SORA_CONFIG.getSystemPrompt === 'function')
                ? SORA_CONFIG.getSystemPrompt(currentSoraMode)
                : (config.prompt || "");

            // Isolasi absolut: ambil hanya pesan dari mode yang aktif (atau pesan awal tanpa tag mode)
            // dan abaikan pesan system_notice
            const recentMessages = messages
                .filter(m => (m.role === 'user' || m.role === 'assistant') && (!m.mode || m.mode === currentSoraMode))
                .slice(-6)
                .map(m => ({
                    role: m.role,
                    content: m.content
                }));

            const payload = {
                model: model,
                messages: [
                    { role: "system", content: systemPrompt },
                    ...recentMessages,
                    { role: "user", content: userText }
                ],
                temperature: 0.7,
                max_tokens: 2048
            };

            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const errText = await res.text().catch(() => "");
                throw new Error(`API Error [${res.status}]: ${errText}`);
            }

            const data = await res.json();
            const reply = data?.choices?.[0]?.message?.content;
            if (!reply || typeof reply !== 'string') {
                throw new Error("Invalid response format");
            }
            return reply.trim();
        }

        async function send(text) {
            const userText = (text ?? input.value).trim();
            if (!userText) return;

            // Jika user meminta stiker via pesan teks chat: kirim HANYA gambar stiker saja tanpa chat teks
            const isStickerReq = /(minta|kirim|bagi|drop|kasih|mau|kirimin|pap|bagiin)\s+.*(stiker|sticker)/i.test(userText) ||
                                 /^(stiker|sticker)(\s*(dong|random|nya|lagi|sora)?|\?*)$/i.test(userText) ||
                                 /(stiker|sticker)\s*(dong|random|lagi)/i.test(userText);
            if (isStickerReq) {
                messages.push({ role: "user", content: userText, mode: currentSoraMode });
                input.value = "";
                autosize(input);
                render();
                setBusy(true);
                setTimeout(() => {
                    const randomFile = SORA_STICKERS[Math.floor(Math.random() * SORA_STICKERS.length)];
                    const imagePath = `../images/mirai/stiker/${randomFile}`;
                    messages.push({
                        role: "assistant",
                        content: `![Stiker Sora](${imagePath})`,
                        mode: currentSoraMode
                    });
                    setBusy(false);
                    render();
                }, 450);
                return;
            }

            messages.push({ role: "user", content: userText, mode: currentSoraMode });
            input.value = "";
            autosize(input);
            render();
            setBusy(true);

            try {
                let reply = null;
                let lastError = null;

                for (const model of MODELS_TO_TRY) {
                    try {
                        reply = await tryModel(userText, model);
                        if (reply) break;
                    } catch (e) {
                        lastError = e;
                    }
                }

                if (!reply) throw lastError || new Error("Semua model gagal");
                messages.push({ role: "assistant", content: reply, mode: currentSoraMode });
            } catch (err) {
                console.error("Error Sora:", err);
                messages.push({ role: "assistant", content: fallbackReply(), mode: currentSoraMode });
            } finally {
                setBusy(false);
                render();
            }
        }

        launcher.addEventListener('click', openDrawer);
        closeBtn.addEventListener('click', closeDrawer);
        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', toggleFullscreen);
        }
        if (modeSwitchBtn) {
            modeSwitchBtn.addEventListener('click', switchSoraMode);
        }
        sendBtn.addEventListener('click', () => send());
        input.addEventListener('input', () => autosize(input));
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });
        const clearConfirmModal = document.getElementById('clearConfirmModal');
        const cancelClearBtn = document.getElementById('cancelClearBtn');
        const confirmClearBtn = document.getElementById('confirmClearBtn');

        function openClearModal() {
            if (clearConfirmModal) {
                clearConfirmModal.classList.add('active');
                clearConfirmModal.setAttribute('aria-hidden', 'false');
            }
        }

        function closeClearModal() {
            if (clearConfirmModal) {
                clearConfirmModal.classList.remove('active');
                clearConfirmModal.setAttribute('aria-hidden', 'true');
            }
        }

        clearBtn.addEventListener('click', openClearModal);
        if (cancelClearBtn) {
            cancelClearBtn.addEventListener('click', closeClearModal);
        }
        if (confirmClearBtn) {
            confirmClearBtn.addEventListener('click', () => {
                messages = [{ role: "assistant", content: DEFAULT_GREETING, mode: currentSoraMode }];
                render();
                closeClearModal();
            });
        }
        if (clearConfirmModal) {
            clearConfirmModal.addEventListener('click', (e) => {
                if (e.target === clearConfirmModal) {
                    closeClearModal();
                }
            });
        }

        // Koleksi Stiker Resmi dari folder images/mirai/stiker/
        const SORA_STICKERS = (SORA_CONFIG && SORA_CONFIG.SORA_STICKERS) ? SORA_CONFIG.SORA_STICKERS : [
            "ada.jpeg", "aku.jpeg", "ala.jpeg", "be.jpeg", "beli.jpeg", "bel.jpeg",
            "ber.jpeg", "cer.jpeg", "dik.jpeg", "dip.jpeg", "don.jpeg", "eet.jpeg",
            "gom.jpeg", "hua.jpeg", "iki.jpeg", "ita.jpeg", "iwa.jpeg", "jaw.jpeg",
            "kar.jpeg", "kok.jpeg", "log.jpeg", "mas.jpeg", "peg.jpeg", "sor.jpeg",
            "sul.jpeg", "woy.jpeg", "yan.jpeg", "yat.jpeg"
        ];

        function sendRandomStickerFromSora() {
            if (typing && typing.classList.contains('show')) return;

            const randomFile = SORA_STICKERS[Math.floor(Math.random() * SORA_STICKERS.length)];
            const imagePath = `../images/mirai/stiker/${randomFile}`;

            messages.push({
                role: "user",
                content: "Minta stiker random dong Sora!"
            });
            render();

            setBusy(true);
            setTimeout(() => {
                messages.push({
                    role: "assistant",
                    content: `![Stiker Sora](${imagePath})`,
                    mode: currentSoraMode
                });
                setBusy(false);
                render();
            }, 450);
        }

        if (randomStickerBtn) {
            randomStickerBtn.addEventListener('click', sendRandomStickerFromSora);
        }

        // Dukungan Scroll Halus Roda Mouse pada Bar Tombol Suggestions
        const suggestionsBox = drawer ? drawer.querySelector('.suggestions') : null;
        if (suggestionsBox) {
            suggestionsBox.addEventListener('wheel', (e) => {
                if (e.deltaY !== 0 && suggestionsBox.scrollWidth > suggestionsBox.clientWidth) {
                    e.preventDefault();
                    suggestionsBox.scrollLeft += e.deltaY;
                }
            }, { passive: false });
        }

        updateModeUI();
        render();
        autosize(input);
        closeDrawer();
    </script>
</body>
</html>
